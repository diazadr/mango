# ─────────────────────────────────────────────────────────────
#  Mosquitto MQTT Broker — Konfigurasi Edge CNC
# ─────────────────────────────────────────────────────────────

# Listener MQTT utama
listener 1883
protocol mqtt

# Listener WebSocket (untuk live panel di browser/Grafana)
listener 9001
protocol websockets

# Autentikasi — allow anonymous for dev environment
allow_anonymous true

# Persistensi pesan (wajib untuk QoS 1 & 2)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Tuning koneksi
max_connections 200
max_inflight_messages 20
max_queued_messages 2000
max_packet_size 131072

version: "3.8"

services:
    backend:
        build: ./backend
        container_name: mango_backend
        restart: unless-stopped
        environment:
            # Override DB ke service name Docker (bukan 127.0.0.1)
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: mango
            DB_USERNAME: postgres
            DB_PASSWORD: polman
            APP_URL: http://localhost:8000
            EDGE_API_KEY: edge_4ZzOdnFc91cfuny8mP0YlB1PAYwoRRoamET99yWw
            EDGE_SITE_ID: POLMAN_BANDUNG_EDGE
        volumes:
            - laravel_code:/var/www
        depends_on:
            - db
        networks:
            - mango_net

    nginx:
        image: nginx:alpine
        container_name: mango_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - laravel_code:/var/www
            - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - backend
        networks:
            - mango_net

    worker_queue:
        build: ./backend
        container_name: mango_worker_queue
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: mango
            DB_USERNAME: postgres
            DB_PASSWORD: polman
        volumes:
            - laravel_code:/var/www
        depends_on:
            - db
        networks:
            - mango_net

    worker_mqtt:
        build: ./backend
        container_name: mango_worker_mqtt
        restart: unless-stopped
        command: ["php", "artisan", "edge:mqtt-listen"]
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: mango
            DB_USERNAME: postgres
            DB_PASSWORD: polman
        volumes:
            - laravel_code:/var/www
        depends_on:
            - db
        networks:
            - mango_net

    frontend:
        build: ./frontend
        container_name: mango_frontend
        restart: unless-stopped
        ports:
            - "3000:3000"
        networks:
            - mango_net

    db:
        image: postgres:16-alpine
        container_name: mango_db
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: mango
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: polman
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - mango_net

volumes:
    postgres_data:
    laravel_code:

networks:
    mango_net:
        driver: bridge
